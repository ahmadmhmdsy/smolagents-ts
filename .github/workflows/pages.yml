name: Pages

# Publish only what CI has proved. This workflow used to deploy on every push to main, so a
# run that CI would reject could still reach the live site. It now runs after a completed CI
# run and builds only when that run succeeded on main, checking out the CI run's own sha
# rather than main's tip, which may have moved while CI was running. A manual dispatch
# rebuilds the current ref for when Pages itself needs a nudge. The deploy job inherits the
# same gate through needs: build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published site
# is worse than a queued deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    # workflow_run fires for every completed CI run, including a failed one. The
    # conclusion and branch are checked explicitly even though the trigger filters
    # branches, because a skipped job is the only safe outcome for a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI proved, not the branch: a green CI result is a claim about
          # one sha, and main may have advanced since that run started.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        # No version input. packageManager in package.json (pnpm@12.3.4) is the single source of truth, and
        # action-setup reads it for pnpm 11+. Pinning 10 here contradicted packageManager and would install
        # with a pnpm older than the one that wrote the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the example first and then the docs site, so the site can host it.
      - run: pnpm site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
