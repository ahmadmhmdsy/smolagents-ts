name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # No version input. packageManager in package.json (pnpm@12.3.4) is the single source of truth, and
        # action-setup reads it for pnpm 11+. Pinning 10 here contradicted packageManager and would install
        # with a pnpm older than the one that wrote the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ matrix.node }}"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm ci:check
      - run: pnpm pack:smoke
      - run: pnpm site:build

  runtime-matrix:
    name: runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # No version input. packageManager in package.json (pnpm@12.3.4) is the single source of truth, and
        # action-setup reads it for pnpm 11+. Pinning 10 here contradicted packageManager and would install
        # with a pnpm older than the one that wrote the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Import the built package directly: this proves the library, not the test runner.
      - run: node scripts/runtime-smoke.mjs
        if: matrix.runtime == 'node'
      - run: bun scripts/runtime-smoke.mjs
        if: matrix.runtime == 'bun'
      - run: deno run -A scripts/runtime-smoke.mjs
        if: matrix.runtime == 'deno'

  # The gate runs on Ubuntu; Windows is where the process backend differs most.
  windows:
    name: tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm audit --prod
